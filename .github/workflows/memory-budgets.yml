name: Portable source and installation fixtures
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Exercise SDK entrypoints with pinned executable fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/memory-budget-portable"
          docker run --rm --init --platform linux/amd64 --network none \
            --cpus 1 --memory 1g --pids-limit 128 --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=384m \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP/memory-budget-portable:/results:rw" -w /workspace \
            ruby:3.4.6-slim-bookworm@sha256:2720b44a26870fc2db86a3c7f4f6aaa7eaee00b730e6d8de141663ef61559efb \
            sh -ec '
              ruby --version > /results/ruby-version.txt
              ruby -rrbconfig -rdigest -e "puts Digest::SHA256.file(RbConfig.ruby).hexdigest" > /results/ruby-sha256.txt
              ruby -Itest -e "Dir[\"test/*_test.rb\"].sort.each { |file| require File.expand_path(file) }" > /results/portable-fixtures.stdout 2> /results/portable-fixtures.stderr
              cat /results/portable-fixtures.stdout
              ruby -e "text=File.read(ARGV.fetch(0)); abort \"Incomplete portable fixture suite\" unless text.match?(/^107 runs, [0-9]+ assertions, 0 failures, 0 errors, 0 skips$/)" /results/portable-fixtures.stdout
              ruby scripts/install_bundle.rb "/tmp/ordinary consumer" > /results/bundle-install.stdout
              ruby -rjson -rdigest -e "root=ARGV.fetch(0); p=JSON.parse(File.read(File.join(root,\"PACKAGE_PINS.json\"))); p.fetch(\"files\").each{|r| abort \"Installed bundle drift\" unless Digest::SHA256.file(File.join(root,r.fetch(\"file\"))).hexdigest==r.fetch(\"sha256\")}; puts JSON.pretty_generate({scope: \"Hash-verified bundle and executable Ruby fixtures; actual Crystal compiler jobs remain zero\", files:p.fetch(\"files\").size, package_version:p.fetch(\"package_version\")})" "/tmp/ordinary consumer/performance/vendor/memory_budget" > /results/installed-bundle.json
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: portable-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/memory-budget-portable/
          if-no-files-found: error
