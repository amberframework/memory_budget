name: Memory documentation corpus
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify canonical hashes and rejection controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/memory-budget-docs"
          docker run --rm --init --network none --cpus 1 --memory 512m --pids-limit 128 \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/memory-budget-docs:/results:rw" \
            -w /workspace -e DOCS_COMMIT="$GITHUB_SHA" \
            python:3.12.10-slim@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db \
            sh -ec 'python --version > /results/python-version.txt; python scripts/docs/manage_corpus.py verify; python -O scripts/docs/manage_corpus.py verify; python scripts/docs/test_corpus.py --source-commit "$DOCS_COMMIT" --report /results/docs-results.json'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: documentation-controls-${{ github.sha }}
          path: ${{ runner.temp }}/memory-budget-docs/
          if-no-files-found: error
