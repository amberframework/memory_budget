name: Grant source package controls

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  source-controls:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - name: Check out exact SDK review source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify publication bytes and run portable source cohorts
        timeout-minutes: 10
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PYTHON'
          import hashlib
          import importlib.util
          import json
          import os
          import pathlib
          import platform
          import subprocess
          import stat
          import sys

          root = pathlib.Path("tools/grant_compile_acceptance").resolve()
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-source-package-controls"
          output.mkdir()
          result = {"source_controls_passed": False, "actual_compiler_container_native_ssh_jobs": 0,
              "accepted_target_cells": 0, "required_target_cells": 144,
              "observed_platform": sys.platform, "python_version": platform.python_version(),
              "run_id": os.environ.get("GITHUB_RUN_ID"), "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "source_commit": os.environ.get("GITHUB_SHA"), "full_native_provider_accepted": False}
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          try:
              pins = root / "PUBLICATION_PINS.v101.json"
              if digest(pins) != "b4510c07cfc5078e12ed24a0f1aaa50a80b861b420c9716d94dfae2beeb71164":
                  raise RuntimeError("Exact publication source manifest required")
              manifest = json.loads(pins.read_text())
              for row in manifest["files"]:
                  path = root / row["path"]
                  if path.parent != root or path.is_symlink() or not path.is_file() or stat.S_IMODE(path.stat().st_mode) != row["mode"] or path.stat().st_size != row["bytes"] or digest(path) != row["sha256"]:
                      raise RuntimeError("Publication input differs: " + row["path"])
              python = pathlib.Path(sys.executable).resolve()
              matches = [row for row in manifest["source_python_profiles"][sys.platform]
                  if platform.python_version() == row["version"] and digest(python) == row["sha256"]]
              if len(matches) != 1:
                  raise RuntimeError("Observed source-test Python needs exact profile review")
              profile = matches[0]
              result["python_sha256"] = digest(python)
              source = root / "verify_publication_v101.py"
              if digest(source) != "728f7df0eb6b36c127bc9ea81e8356834cb2272acfd6ae357f8ec27cfe219695":
                  raise RuntimeError("Exact v101 verifier source required before import")
              spec = importlib.util.spec_from_file_location("reviewed_grant_publication", source)
              verifier = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(verifier)
              archive = root / "grant-linux-first-build-publication-v101.tar.gz"
              verification = verifier.verify(archive, manifest["outer_archive_sha256"], manifest["contents_sha256"], output / "verified package with spaces")
              (output / "VERIFICATION_RECEIPT.json").write_text(json.dumps(verification, indent=2) + "\n")
              damaged = output / "changed-archive.tar.gz"
              changed = bytearray(archive.read_bytes()); changed[-1] ^= 1; damaged.write_bytes(changed)
              try:
                  verifier.verify(damaged, manifest["outer_archive_sha256"], manifest["contents_sha256"], output / "changed artifact refusal")
              except ValueError as error:
                  if "digest required" not in str(error):
                      raise
                  result["changed_archive_refused"] = True
              else:
                  raise RuntimeError("Changed publication archive was accepted")
              payload = output / "verified package with spaces" / verifier.PREFIX
              args = [str(python), "-I", "-S", "-B", str(payload / "tools/run_source_tests_v101.py"),
                  "--sdk-checkout", str(pathlib.Path.cwd()), "--contents-sha256", manifest["contents_sha256"],
                  "--python-sha256", profile["sha256"], "--python-version", profile["version"],
                  "--output", str(output / "source cohorts with spaces")]
              with (output / "cohorts.stdout.txt").open("xb") as stdout, (output / "cohorts.stderr.txt").open("xb") as stderr:
                  completed = subprocess.run(args, stdin=subprocess.DEVNULL, stdout=stdout, stderr=stderr, timeout=540, check=False)
              result["source_wrapper_exit_code"] = completed.returncode
              if sum((output / name).stat().st_size for name in ("cohorts.stdout.txt", "cohorts.stderr.txt")) > 8 * 2**20:
                  raise RuntimeError("Bounded complete source-wrapper output required")
              if completed.returncode:
                  raise RuntimeError("Portable source cohort wrapper failed")
              receipt = json.loads((output / "source cohorts with spaces/SOURCE_TEST_RECEIPT.json").read_text())
              if receipt["source_tests_passed"] is not True or len(receipt["cohorts"]) != 4 or not all(row["passed"] for row in receipt["cohorts"]):
                  raise RuntimeError("Every complete original source cohort must pass")
              regressions = receipt.get("successor_regressions", [])
              if len(regressions) != 2 or not all(row["passed"] and row["expected_tests"] == 12 for row in regressions):
                  raise RuntimeError("Both complete successor regression cohorts must pass")
              result["original_source_test_executions"] = sum(row["expected_tests"] for row in receipt["cohorts"])
              result["successor_regression_test_executions"] = sum(row["expected_tests"] for row in regressions)
              if digest(python) != profile["sha256"]:
                  raise RuntimeError("Source-test Python changed")
              result["actual_linux_source_cohorts_executed"] = sys.platform == "linux"
              result["source_controls_passed"] = True
          except Exception as error:
              result["error"] = type(error).__name__ + ": " + str(error)
          finally:
              (output / "CI_SOURCE_EXECUTION.json").write_text(json.dumps(result, indent=2) + "\n")
              print(json.dumps(result, indent=2))
          raise SystemExit(0 if result["source_controls_passed"] else 2)
          PYTHON

      - name: Preserve source package execution and refusals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: grant-source-package-${{ matrix.os }}
          path: ${{ runner.temp }}/grant-source-package-controls
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
