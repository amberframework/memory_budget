name: Memory budgets
on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
    outputs:
      source_commit:
        description: Exact source commit accepted by the memory gate
        value: ${{ jobs.memory-budgets.outputs.source_commit }}
permissions:
  contents: read
concurrency:
  group: memory-budgets-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  memory-budgets:
    name: memory-budgets / darwin-arm64-v1
    runs-on: [self-hosted, macOS, ARM64, atlas-memory-budget-v1]
    timeout-minutes: 20
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install checksum-locked dependencies
        if: ${{ hashFiles('shard.lock') != '' }}
        run: |
          mkdir -p performance/results
          dependency_status=0
          ruby performance/vendor/memory_budget/scripts/install_frozen_dependencies.rb > performance/results/dependencies.stdout.txt 2> performance/results/dependencies.stderr.txt || dependency_status=$?
          cat performance/results/dependencies.stdout.txt
          cat performance/results/dependencies.stderr.txt >&2
          exit "$dependency_status"
      - name: Record accepted source identity
        id: source
        run: printf 'source_commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Enforce budgets and prove regression detection
        run: ruby performance/run_memory_budgets.rb --self-test
        env:
          CRYSTAL_WORKERS: "1"
          CRYSTAL_CACHE_DIR: ${{ runner.temp }}/memory-budgets-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve measurements and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-budgets-${{ github.sha }}
          path: performance/results/
          include-hidden-files: true
          if-no-files-found: error
